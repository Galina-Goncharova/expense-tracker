<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My expense tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Привет, World!</h1>
    <form id="form">
      <label>
        название расхода
        <input id="title" type="text" name="title" />
      </label>
      <label>
        сумма расхода
        <input id="amount" type="text" name="amount" />
      </label>
      <button id="addExpense" type="submit">Добавить</button>
    </form>
    <ul id="list"></ul>
    <p id="total">Итого: <span class="totalSumNumber">0</span></p>
    <script type="module" src="index.js"></script>
  </body>
</html>
